services:
  - type: web
    name: aihelper-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    disk:
      name: corrections
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ASSISTANT_DB
        value: /var/data/web.db
      - key: ASSISTANT_ALLOWED_HOSTS
        sync: false
      - key: ASSISTANT_API_KEY
        sync: false
      - key: ASSISTANT_MODEL
        sync: false
      - key: ASSISTANT_DAILY_LIMIT
        value: '50'
      - key: ASSISTANT_USER_DAILY_LIMIT
        value: '10'
